[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "coronelli"
version = "0.1.0"
description = "Turn a book into an interactive atlas."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["literature", "atlas", "maps", "nlp", "fiction"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pymupdf",
    "python-multipart",
    "jsonschema",
    "openai",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/JanviChawla/coronelli"
Repository = "https://github.com/JanviChawla/coronelli"

[project.scripts]
coronelli = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
